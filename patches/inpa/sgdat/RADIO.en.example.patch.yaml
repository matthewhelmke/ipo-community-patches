target_encoding: cp1252
description: |
  Example patch — minimal English translation of a handful of menu
  labels in BMW's RADIO.IPO (the diagnostic script for old BM5x-series
  radios, address 0x68 on the K-bus / I-bus).

  Intended as a template for newcomers — open it, change the values,
  resubmit. The German labels here are the original strings; the
  English replacements are short, equivalent, and stay within cp1252.

  If your local copy of RADIO.IPO has a different checksum, this
  patch is targeting a different distribution. Regenerate against
  your own copy with `ipo-editor patch init RADIO.IPO` and adapt.

created_at: 2026-05-15T08:00:00.000Z
